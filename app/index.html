<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232a78d6'/><text x='16' y='22' font-size='15' font-family='system-ui' font-weight='700' text-anchor='middle' fill='white'>DE</text></svg>" />
    <title>Kurs niemieckiego — pulpit</title>
    <script>
      // Motyw przed pierwszym renderem — bez mignięcia jasnej strony w trybie ciemnym.
      try {
        var m = localStorage.getItem("niemiec-motyw");
        if (m === "light" || m === "dark") document.documentElement.dataset.theme = m;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
